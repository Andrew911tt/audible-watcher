# Read-only smoke tests against Audible's real public catalog: catch changes
# in Audible's data or search behaviour that the faked catalog in the normal
# tests can't see. Weekly, and on demand from the Actions tab.
name: live-catalog
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest live_tests -v
        env:
          AW_LIVE_TESTS: "1"
