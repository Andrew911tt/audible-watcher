# Push a tag like v1.0.0 to release: the tag must match version.py and
# CHANGELOG.md must have a section for it (that section becomes the release
# notes). The full test suite (every OS and Python version, plus the Docker
# check) must pass first. Then it builds the
# Windows installer, attaches it to a GitHub release, and publishes the
# Docker image to ghcr.io/<owner>/audible-watcher.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  version:
    # the tag must match version.py, or the app would report the wrong
    # version (and keep offering itself as an update)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version.py
        run: |
          v=$(python3 -c "from version import __version__; print(__version__)")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version.py ($v)"
            exit 1
          fi
      - name: CHANGELOG.md has notes for this version
        run: |
          if ! python3 packaging/release_notes.py "${GITHUB_REF_NAME}" > /dev/null; then
            echo "::error::Add a section for ${GITHUB_REF_NAME#v} to CHANGELOG.md"
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: python packaging/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - name: Build app and installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          ./packaging/build_windows.ps1 -Version $v
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/AudibleWatcher-Setup-*.exe
          body_path: release-notes.md
          generate_release_notes: true

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          v="${GITHUB_REF_NAME#v}"
          img="${{ steps.image.outputs.name }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$v" \
            -t "$img:$v" -t "$img:latest" .
          docker push "$img:$v"
          docker push "$img:latest"
