# Push a tag like v1.0.0 to release: the full test suite (every OS and
# Python version, plus the Docker check) must pass first. Then it builds the
# Windows installer, attaches it to a GitHub release, and publishes the
# Docker image to ghcr.io/<owner>/audible-watcher.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build app and installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          ./packaging/build_windows.ps1 -Version $v
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/AudibleWatcher-Setup-*.exe
          generate_release_notes: true

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          v="${GITHUB_REF_NAME#v}"
          img="${{ steps.image.outputs.name }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$v" \
            -t "$img:$v" -t "$img:latest" .
          docker push "$img:$v"
          docker push "$img:latest"
